---
# .pre-commit-config.yaml

exclude: ^.github_data/|^docs/issues/|^docs/pull-requests/

repos:
  # Branch-name gate — kept FIRST so it fails before anything slower runs.
  #
  # This replaces a `no-commit-to-branch --pattern` that accepted `<type>/<slug>` with NO issue
  # number. Its reasoning was that `.gitmessage` already forces `Refs: #<issue>`, so requiring the
  # number in the branch name too "bought nothing" — reasonable in isolation, but CI does not agree:
  # `.github/workflows/ci.yml`'s `Validate branch name` step REQUIRES `<type>/<issue>-<summary>` for
  # every type except `chore`. So the local gate was strictly more permissive than the one that
  # actually blocks merges, and a branch could pass everything here and fail only after a ~45-minute
  # CI leg (#499 — which is exactly how it was found).
  #
  # The script mirrors CI's `ALLOWED` clause for clause, and reads the TYPE LIST from `.vig-os`'s
  # `DEVKIT_BRANCH_TYPES` — the same key CI's resolve-toolchain action reads — so the two gates cannot
  # drift on which types exist. Only the shape rule is written twice, and the script says so.
  #
  # CI's copy is devkit-managed, so if the rule should change, change it upstream first: a local-only
  # relaxation would be reverted by the next scaffold upgrade while CI kept rejecting.
  - repo: local
    hooks:
      - id: branch-name
        name: branch-name (mirrors CI's <type>/<issue>-<summary> gate)
        entry: scripts/check-branch-name.sh
        language: script
        pass_filenames: false
        always_run: true

  # General Pre-commit Hooks (Fixes formatting issues)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
        # The three JSONC scaffold files carry a `//` provenance banner (#1053)
        # that check-json's strict parser rejects; VS Code / the devcontainer
        # CLI accept it. Strict-JSON files (renovate.json etc.) stay checked.
        exclude: (^|/)(\.devcontainer/devcontainer\.json|\.vscode/settings\.json|\.devcontainer/workspace\.code-workspace\.example)$
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
        # `trust.rs` documents the PEM header the loader accepts (a doc comment)
        # and writes it verbatim in a malformed-key negative test. The detector
        # is a byte substring scan with no inline escape, so it cannot tell a
        # header mention from a key. The real fixture it used to flag was removed
        # in this same change; these two remaining mentions are by design.
        exclude: ^tessera/crates/tessera-cli/src/trust\.rs$
      # `*.trycmd` files are BYTE-EXACT CLI snapshots: trycmd compares the
      # recorded stdout verbatim, and clap's help output carries meaningful
      # trailing spaces. An autofixer that "cleans" them silently rewrites the
      # expected output and the assertion then fails against the real CLI --
      # which is exactly what happened here before this exclude existed.
      # Data files the whitespace fixers must not touch.
      - id: end-of-file-fixer
        exclude: \.trycmd$
      - id: mixed-line-ending
        exclude: \.trycmd$
      - id: trailing-whitespace
        exclude: \.trycmd$

  # Python Linting and Formatting (Ruff). From Nix, like typos/shellcheck above:
  # ruff-pre-commit installs a generic-linux wheel whose dynamically linked
  # binary cannot start on NixOS, so the hook failed with exit 127 locally while
  # passing in CI -- the exact split this repo already avoids for the other fast
  # movers. Sourcing it from the dev-shell makes local and CI run one binary.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

  # YAML Linting
  - repo: https://github.com/adrienverge/yamllint
    rev: 81e9f98ffd059efe8aa9c1b1a42e5cce61b640c6  # v1.35.1
    hooks:
      - id: yamllint
        args: ["--format", "parsable", "--strict"]

  # Shellcheck — the Nix-provided binary, NOT the `shellcheck-py` PyPI wrapper.
  #
  # `shellcheck-py` builds a wheel inside prek's vendored uv cache, and that build asserts the
  # interpreter tag matches the wheel tag. On this toolchain it does not
  # (`AssertionError: would build wheel with unsupported tag ('cp313','cp312','linux_x86_64')`),
  # so hook INSTALLATION failed — and because prek installs in file order, every hook declared
  # below this point (all six guardrails agent-drift gates, rustfmt, clippy, cargo-deny,
  # gitleaks) never ran either. One unbuildable Python wrapper silently disabled the entire
  # local gate suite. The devShell already puts a pinned `shellcheck` on PATH; use it.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        types: [shell]
        # .envrc files (root + the scaffolded template stub) are direnv stdlib
        # scripts with no shebang; exclude them from SC2148 at any path.
        exclude: (^|/)\.envrc$

  # Composite-action shell linting (vig-utils' shellcheck-composite-actions,
  # #1704). actionlint refuses a composite action outright (`unexpected key
  # "runs" for "workflow" section`) and has no composite mode, so every `run:`
  # body moved out of a workflow and into .github/actions/*/action.yml loses its
  # shellcheck pass. This hook reproduces actionlint's own recipe over those
  # bodies — same `${{ }}` neutralisation, same prelude, same exclude list — so
  # the two hooks gate one lint. shellcheck itself resolves from PATH (it ships
  # in devTools in every mode), like actionlint above.
  - repo: local
    hooks:
      - id: shellcheck-composite-actions
        name: shellcheck-composite-actions (lint composite action run bodies)
        entry: uv run shellcheck-composite-actions
        language: system
        files: (^|/)\.github/actions/[^/]+/action\.ya?ml$
        pass_filenames: true

  # Containerfile
  - repo: https://github.com/hadolint/hadolint
    rev: 346e4199e4baca7d6827f20ac078b6eee5b39327  # v2.9.3
    hooks:
      - id: hadolint-docker
        name: hadolint

  # Markdown Linting (excludes auto-generated docs)
  - repo: local
    hooks:
      - id: pymarkdown
        name: pymarkdown
        entry: pymarkdown
        language: system
        types: [markdown]
        args: ["-c", ".pymarkdown", "fix"]
        exclude: ^(README\.md|CONTRIBUTING\.md|TESTING\.md)

  # Justfile formatting
  - repo: local
    hooks:
      - id: just-fmt
        name: just (format justfiles)
        entry: just --fmt --unstable
        language: system
        files: ^justfile(\..*)?$
        pass_filenames: false

  # typos — the Nix-provided binary. prek's installer fetches a generic-linux dynamically
  # linked executable, which NixOS cannot run at all ("Could not start dynamically linked
  # executable", nix.dev/permalink/stub-ld). Same failure class as shellcheck-py above.
  - repo: local
    hooks:
      - id: typos
        name: typos (spell check)
        # --force-exclude: honour _typos.toml [files] extend-exclude even for the explicit
        # staged-file paths prek passes (binary corpus .tsra vectors are excluded there).
        entry: typos --force-exclude
        language: system

  # GitHub Actions SHA pinning enforcement
  - repo: local
    hooks:
      - id: check-action-pins
        name: check-action-pins (verify SHA-pinned actions)
        entry: scripts/check-action-pins.sh
        language: script
        files: ^\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml)$
        pass_filenames: false

  # Skill directory naming convention
  - repo: local
    hooks:
      - id: check-skill-names
        name: check-skill-names (enforce naming convention)
        entry: scripts/check-skill-names.sh .claude/skills
        language: script
        files: ^\.claude/skills/
        pass_filenames: false

  # ADR ↔ FEATURE-MATRIX: advisory pre-push nudge (the HARD gate is in nix flake check →
  # guardrails-gates → scripts/check-adr-matrix.sh, which --no-verify cannot bypass).
  - repo: local
    hooks:
      - id: adr-matrix-reminder
        name: ADR changed — consider a FEATURE-MATRIX row (advisory)
        entry: scripts/adr-matrix-reminder.sh
        language: script
        files: ^docs/adr/.*\.md$
        stages: [pre-push]
        verbose: true
        pass_filenames: false

  # ─── guardrails (gerchowl/guardrails) — agent-drift gates, run by prek ───
  # Binaries come from the Nix devShell (flake.nix → guardrails.lib.mkDevShell); `direnv allow`
  # / `nix develop` puts them on PATH and auto-installs these hooks. Escape one line with a
  # trailing `guardrails-ok`. Run `guardrails info` for the gate list + config knobs.
  - repo: local
    hooks:
      - id: no-fake-impl
        name: no fake/placeholder implementations
        entry: guardrails-no-fake-impl
        language: system
        pass_filenames: true
      - id: no-debug-leftovers
        name: no debug-print leftovers (use the tracing facade)
        entry: guardrails-no-debug-leftovers
        language: system
        pass_filenames: true
        # Report-printing benchmark/corpus harnesses: `print()` IS their output.
        exclude: ^tessera/(bench|corpus)/.*/run\.py$
      - id: no-commented-code
        name: no commented-out code
        entry: guardrails-no-commented-code
        language: system
        pass_filenames: true
      - id: no-conflict-markers
        name: no committed merge-conflict markers
        entry: guardrails-no-conflict-markers
        language: system
        pass_filenames: true
      - id: derived-docs
        name: derived docs match their source-of-truth command
        entry: guardrails-derived-docs
        language: system
        pass_filenames: true
      - id: gitleaks
        name: secrets scan
        entry: gitleaks protect --staged --redact -v
        language: system
        pass_filenames: false
      # ── Rust workspace lives in tessera/ — scope the cargo gates there ──
      - id: rustfmt
        name: rustfmt (tessera workspace)
        entry: bash -euo pipefail -c 'cd tessera && cargo fmt --all -- --check'
        language: system
        files: ^tessera/.*\.rs$
        pass_filenames: false
      - id: clippy
        name: clippy -D warnings (tessera workspace)
        entry: bash -euo pipefail -c 'cd tessera && cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        files: ^tessera/.*\.rs$
        pass_filenames: false
      - id: cargo-deny
        name: cargo-deny (licenses + advisories)
        entry: bash -euo pipefail -c 'cd tessera && cargo deny check'
        language: system
        files: ^tessera/.*Cargo\.(toml|lock)$
        pass_filenames: false

  # Commit message validation (commit-msg stage)
  - repo: local
    hooks:
      - id: validate-commit-msg
        name: validate commit message
        entry: scripts/validate-commit-msg.sh
        language: script
        stages: [commit-msg]
        # Optional: customize commit types, scopes, or refs-optional types via CLI arguments.
        # By default, scopes are not enforced. Set --scopes to require specific scopes.
        # Examples (choose one args line):
        #   args: ["--types", "feat,fix,docs,chore"]
        #   args: ["--scopes", "api,cli,utils"]
        #   args: ["--refs-optional-types", "chore"]
        #   args: ["--types", "feat,fix,docs", "--scopes", "api,cli,utils", "--refs-optional-types", "chore"]
