---
# .pre-commit-config.yaml

exclude: ^.github_data/|^docs/issues/|^docs/pull-requests/

repos:
  # General Pre-commit Hooks (Fixes formatting issues)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      # Enforce topic branch naming: `<type>/<summary>`.
      #
      # The issue number is OPTIONAL — put it in the summary (`feat/349-log-axis-transform`) when
      # there is one. It is NOT required in the branch name because `.gitmessage` already makes
      # every commit carry `Refs: #<issue>`; requiring it in both places bought nothing and
      # blocked most real work.
      #
      # The type list is derived from branch names actually used on merged PRs (checked against
      # `gh pr list --state merged`), not from an aspirational convention: the previous pattern
      # rejected `feat/`, `fix/`, `perf/`, `polish/`, `land/` and `spike/` — i.e. 14 of the last
      # 30 merged PR branches, including the branch that graduated the spike. A gate that no real
      # branch can satisfy is not a gate; it just teaches everyone to pass `--no-verify`, which
      # then bypasses the *other* gates in this file too.
      #
      # `release/<semver>` is kept strict on purpose (release-plz owns that namespace).
      # Allows main, dev, and branches matching the convention.
      - id: no-commit-to-branch
        name: branch-name (enforce <type>/<summary>)
        args:
          - --branch
          - __none__  # override default so main/dev are not protected
          - --pattern
          - "^(?!main$)(?!dev$)(?!(chore|feat|feature|fix|bugfix|hotfix|perf|polish|spike|refactor|docs|test|build|ci|style|land)/[a-z0-9][a-z0-9._-]*$)(?!release/[0-9]+\\.[0-9]+(\\.[0-9]+)?$)(?!worktree/[0-9]+$).+$"
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Python Linting and Formatting (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aad66557af3b56ba6d4d69cd1b6cba87cef50cbb  # v0.14.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # YAML Linting
  - repo: https://github.com/adrienverge/yamllint
    rev: 81e9f98ffd059efe8aa9c1b1a42e5cce61b640c6  # v1.35.1
    hooks:
      - id: yamllint
        args: ["--format", "parsable", "--strict"]

  # Shellcheck — the Nix-provided binary, NOT the `shellcheck-py` PyPI wrapper.
  #
  # `shellcheck-py` builds a wheel inside prek's vendored uv cache, and that build asserts the
  # interpreter tag matches the wheel tag. On this toolchain it does not
  # (`AssertionError: would build wheel with unsupported tag ('cp313','cp312','linux_x86_64')`),
  # so hook INSTALLATION failed — and because prek installs in file order, every hook declared
  # below this point (all six guardrails agent-drift gates, rustfmt, clippy, cargo-deny,
  # gitleaks) never ran either. One unbuildable Python wrapper silently disabled the entire
  # local gate suite. The devShell already puts a pinned `shellcheck` on PATH; use it.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        types: [shell]

  # Containerfile
  - repo: https://github.com/hadolint/hadolint
    rev: 346e4199e4baca7d6827f20ac078b6eee5b39327  # v2.9.3
    hooks:
      - id: hadolint-docker
        name: hadolint

  # Markdown Linting (excludes auto-generated docs)
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: f93643d339dfee2a1022e7b05e8b5a281bfac553  # v0.9.23
    hooks:
      - id: pymarkdown
        name: pymarkdown
        args: ["-c", ".pymarkdown", "fix"]
        exclude: ^(README\.md|CONTRIBUTE\.md|TESTING\.md)

  # Justfile formatting
  - repo: local
    hooks:
      - id: just-fmt
        name: just (format justfiles)
        entry: just --fmt --unstable
        language: system
        files: ^justfile(\..*)?$
        pass_filenames: false

  # typos — the Nix-provided binary. prek's installer fetches a generic-linux dynamically
  # linked executable, which NixOS cannot run at all ("Could not start dynamically linked
  # executable", nix.dev/permalink/stub-ld). Same failure class as shellcheck-py above.
  - repo: local
    hooks:
      - id: typos
        name: typos (spell check)
        # --force-exclude: honour _typos.toml [files] extend-exclude even for the explicit
        # staged-file paths prek passes (binary corpus .tsra vectors are excluded there).
        entry: typos --force-exclude
        language: system

  # GitHub Actions SHA pinning enforcement
  - repo: local
    hooks:
      - id: check-action-pins
        name: check-action-pins (verify SHA-pinned actions)
        entry: scripts/check-action-pins.sh
        language: script
        files: ^\.github/(workflows/.*\.ya?ml|actions/.*/action\.ya?ml)$
        pass_filenames: false

  # Skill directory naming convention
  - repo: local
    hooks:
      - id: check-skill-names
        name: check-skill-names (enforce naming convention)
        entry: scripts/check-skill-names.sh .cursor/skills
        language: script
        files: ^\.cursor/skills/
        pass_filenames: false

  # ADR ↔ FEATURE-MATRIX: advisory pre-push nudge (the HARD gate is in nix flake check →
  # guardrails-gates → scripts/check-adr-matrix.sh, which --no-verify cannot bypass).
  - repo: local
    hooks:
      - id: adr-matrix-reminder
        name: ADR changed — consider a FEATURE-MATRIX row (advisory)
        entry: scripts/adr-matrix-reminder.sh
        language: script
        files: ^docs/adr/.*\.md$
        stages: [pre-push]
        verbose: true
        pass_filenames: false

  # ─── guardrails (gerchowl/guardrails) — agent-drift gates, run by prek ───
  # Binaries come from the Nix devShell (flake.nix → guardrails.lib.mkDevShell); `direnv allow`
  # / `nix develop` puts them on PATH and auto-installs these hooks. Escape one line with a
  # trailing `guardrails-ok`. Run `guardrails info` for the gate list + config knobs.
  - repo: local
    hooks:
      - id: no-fake-impl
        name: no fake/placeholder implementations
        entry: guardrails-no-fake-impl
        language: system
        pass_filenames: true
      - id: no-debug-leftovers
        name: no debug-print leftovers (use the tracing facade)
        entry: guardrails-no-debug-leftovers
        language: system
        pass_filenames: true
      - id: no-commented-code
        name: no commented-out code
        entry: guardrails-no-commented-code
        language: system
        pass_filenames: true
      - id: no-conflict-markers
        name: no committed merge-conflict markers
        entry: guardrails-no-conflict-markers
        language: system
        pass_filenames: true
      - id: derived-docs
        name: derived docs match their source-of-truth command
        entry: guardrails-derived-docs
        language: system
        pass_filenames: true
      - id: gitleaks
        name: secrets scan
        entry: gitleaks protect --staged --redact -v
        language: system
        pass_filenames: false
      # ── Rust workspace lives in tessera/ — scope the cargo gates there ──
      - id: rustfmt
        name: rustfmt (tessera workspace)
        entry: bash -euo pipefail -c 'cd tessera && cargo fmt --all -- --check'
        language: system
        files: ^tessera/.*\.rs$
        pass_filenames: false
      - id: clippy
        name: clippy -D warnings (tessera workspace)
        entry: bash -euo pipefail -c 'cd tessera && cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        files: ^tessera/.*\.rs$
        pass_filenames: false
      - id: cargo-deny
        name: cargo-deny (licenses + advisories)
        entry: bash -euo pipefail -c 'cd tessera && cargo deny check'
        language: system
        files: ^tessera/.*Cargo\.(toml|lock)$
        pass_filenames: false

  # Commit message validation (commit-msg stage)
  - repo: local
    hooks:
      - id: validate-commit-msg
        name: validate commit message
        entry: scripts/validate-commit-msg.sh
        language: script
        stages: [commit-msg]
        # Optional: customize commit types, scopes, or refs-optional types via CLI arguments.
        # By default, scopes are not enforced. Set --scopes to require specific scopes.
        # Examples (choose one args line):
        #   args: ["--types", "feat,fix,docs,chore"]
        #   args: ["--scopes", "api,cli,utils"]
        #   args: ["--refs-optional-types", "chore"]
        #   args: ["--types", "feat,fix,docs", "--scopes", "api,cli,utils", "--refs-optional-types", "chore"]
