# Release pipeline — ADR-0052. release-plz drives the workspace version + CHANGELOG from conventional
# commits. .github/workflows/release-plz.yml runs ONLY `release-plz release-pr`, which opens/updates a
# HELD release PR (version bump + CHANGELOG); it never tags or publishes. A release is cut by merging
# that PR and then pushing the unified `v<version>` tag on the merge commit (operator step).
#
# BASELINE: release-plz compares against the LAST `v*` RELEASE TAG (checked out and passed as
# `--registry-manifest-path`), not against crates.io (#606). Tessera's crates are deliberately not
# published to crates.io, so the default registry baseline saw every crate as never released and never
# proposed a release. `git_only = true` is not an alternative: it opens the git repository at the
# manifest's directory, and the workspace lives in `tessera/`.
#
# NB: do NOT set `release = false` here — that removes every package from release-plz's view
# ("no public packages found") and breaks `release-pr` too. The HOLD comes from running only
# `release-pr`, not from disabling release. If crates.io publishing is ever wired (CARGO_REGISTRY_TOKEN),
# set `publish = false` on `tessera-py` / `tessera-wasm` (cdylibs → PyPI / npm) to keep them off crates.io.
[workspace]
# cargo-semver-checks is OFF. With a baseline, release-plz runs it on every library crate, building
# rustdoc for the current AND the released tree — and tessera-ingest links the system libhdf5, which a
# bare CI runner does not have. Its verdict also cannot change a pre-release bump (0.1.0-alpha.N →
# alpha.N+1 regardless); it only annotates the release PR. Turning it on means running release-plz where
# libhdf5 resolves (the nix dev shell) — tracked in #607.
semver_check = false
#
# CONVENTIONS (#629). release-plz names the release PR branch `<pr_branch_prefix><RFC 3339 timestamp>`
# (e.g. chore/release-plz-2026-10-18T13-31-15Z) and has no setting for the timestamp. Its uppercase `T`/`Z`
# fit no branch shape in docs/COMMIT_MESSAGE_STANDARD.md, so the CI branch-name gate exempts PRs opened by a
# bot account (this App), keyed on the PR author, never on the branch name. The `chore/` prefix keeps the
# name readable as maintenance. It is also how release-plz FINDS its open PR (it matches open PRs by this
# prefix): changing it orphans an open release PR, which then has to be closed by hand. The release
# commit's message is the PR title (`chore: release v<version>`); release-plz has no separate commit-message
# setting. It needs no `Refs:` line: `chore` is Refs-optional and the commit's author is the App's `[bot]`
# account, both exempt in the standard. GitHub signs the commit (it is made through the API).
pr_branch_prefix = "chore/release-plz-"
#
# HANDOFF → cargo-dist (the broad binary channel; see /dist-workspace.toml + /.github/workflows/
# release.yml). release-plz owns the version bump and CHANGELOG; the operator pushes the tag. That tag
# is the single cut trigger: cargo-dist's release.yml fires on any tag matching
# `**[0-9]+.[0-9]+.[0-9]+*` and attaches the prebuilt `tessera` binaries + `curl | sh` installer to the
# GitHub Release; release-nix.yml attaches the reproducible nix/crane musl binary + maturin wheel to the
# same Release. Release tags are unified `v<version>` (as v0.1.0-alpha.1 was), which is also the shape
# the baseline lookup (scripts/last-release-tag.sh) reads.
