# Repo-owned (NOT devkit-managed — devkit regenerates only its own actions): the dependency cache
# for `nix flake check` (#507).
#
# Every leg used to rebuild `tessera-deps` (crane buildDepsOnly) from source: a SERIAL prefix of
# 8.8–14.7 min — nothing heavy starts until it finishes. Measured as first to last `tessera-deps>`
# log line over 14 legs (12 post-#514 nix-check legs and #544's two cold dispatch runs): x86
# 14.0–14.7, aarch64 10.1–10.6, one fast x86 runner 8.8. Its runtime closure (793 paths: the
# artifact, the vendored crate sources, the rust-overlay toolchain) is almost entirely absent from
# cache.nixos.org (2.11 of 2.47 GiB), so it is exported as a zstd `file://` binary cache (~1.1 GiB)
# into the GitHub Actions cache. Measured warm: restore 6–7 s + import 7–11 s replaces the prefix.
#
# KEY = the hash of the deps DERIVATION (`legacyPackages.<system>.cargoArtifacts`), so it changes
# exactly when the artifact would: Cargo.lock, flake.lock, toolchain, or a crane argument.
#
# `restore` can only ever SAVE time. A miss or a failed import falls through to building as before,
# with a warning annotation. A flake that does not EVALUATE is not this action's failure
# either: Locate warns and skips the cache, so the error is reported by the build step that follows,
# under its own name, instead of by "Locate the dependency artifacts".
#
# Two modes:
#
#   restore  locate the key, restore the closure, import it into the store. Used by every check job
#            just before it builds. With `lookup-only`, only reports whether the key exists — and
#            with `system`, for ANOTHER architecture: the key is a derivation hash, and evaluation
#            is pure, so an x86 runner computes the aarch64 key exactly (measured: identical drv).
#   ensure   look the key up; on a miss, build `tessera-deps`, export it and save it. Used by the
#            dev/main warmer and by nix-check's `deps` job (#517), which runs ONCE per missing arch
#            ahead of the check matrix, so a cold key is built once instead of by every check job.
#            A failed BUILD fails the step (it is a real failure); a failed export only warns.
#
#   - uses: ./.github/actions/nix-deps-cache          # restore (+ import)
#     id: deps
#   - uses: ./.github/actions/nix-deps-cache          # ensure (lookup; build + save on a miss)
#     with: { mode: ensure }
name: nix-deps-cache
description: Restore, or ensure the existence of, the tessera-deps closure in the GitHub Actions cache.

inputs:
  mode:
    description: "`restore` (locate, restore, import) or `ensure` (locate, look up; on a miss build, export, save)."
    default: restore
  lookup-only:
    description: "restore mode: only check whether the key exists; download nothing, import nothing."
    default: "false"
  system:
    description: "The nix system whose key to locate; defaults to this runner's."
    default: ""

outputs:
  key:
    description: The cache key (deps derivation hash).
    value: ${{ steps.locate.outputs.key }}
  out:
    description: The tessera-deps store path.
    value: ${{ steps.locate.outputs.out }}
  dir:
    description: The binary-cache directory.
    value: ${{ steps.locate.outputs.dir }}
  hit:
    description: "'true' on an exact key hit."
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Locate the dependency artifacts
      id: locate
      shell: bash
      env:
        SYSTEM: ${{ inputs.system }}
      run: |
        # Non-fatal by design: with no key, every later step skips, and the build step that follows
        # evaluates the same flake and fails with the real error under its own name.
        if ! { sys=${SYSTEM:-$(nix eval --impure --raw --expr builtins.currentSystem)} \
            && drv=$(nix eval --raw ".#legacyPackages.${sys}.cargoArtifacts.drvPath") \
            && out=$(nix eval --raw ".#legacyPackages.${sys}.cargoArtifacts.outPath"); }; then
          echo "::warning title=dependency cache::the flake did not evaluate; skipping the cache (the build step reports the error) (#507)"
          exit 0
        fi
        hash=$(basename "$drv" | cut -d- -f1)
        {
          echo "key=nix-deps-v1-${sys}-${hash}"
          echo "out=${out}"
          echo "dir=${RUNNER_TEMP}/nix-deps-cache"
          echo "sys=${sys}"
        } >> "$GITHUB_OUTPUT"
        echo "deps artifact ${out}"
        echo "cache key     nix-deps-v1-${sys}-${hash}"
        # Importing an UNSIGNED binary cache needs a trusted nix user. Hosted runners report
        # `root runner` (measured, #507); recorded so a future change of runner is diagnosable.
        echo "trusted-users: $(nix config show trusted-users 2>/dev/null || echo '?')"

    # The cache's version hash covers the PATH, so `dir` must be the same string on every runner that
    # shares a key: RUNNER_TEMP is /home/runner/work/_temp on both hosted images (a cross-arch
    # lookup-only hit from `plan` proves it).
    - name: Restore the dependency cache
      id: restore
      if: steps.locate.outputs.key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.locate.outputs.dir }}
        key: ${{ steps.locate.outputs.key }}
        lookup-only: ${{ inputs.mode == 'ensure' || inputs.lookup-only == 'true' }}

    - name: Import the dependency cache
      if: >-
        inputs.mode == 'restore' && steps.locate.outputs.key != ''
        && inputs.lookup-only != 'true' && steps.restore.outputs.cache-hit == 'true'
      shell: bash
      env:
        DEPS_DIR: ${{ steps.locate.outputs.dir }}
        DEPS_OUT: ${{ steps.locate.outputs.out }}
      run: |
        t0=$(date +%s)
        if nix copy --no-check-sigs --from "file://${DEPS_DIR}" "${DEPS_OUT}"; then
          echo "imported ${DEPS_OUT} and its closure in $(( $(date +%s) - t0 )) s"
        else
          echo "::warning title=dependency cache::import failed; building tessera-deps from source as before (#507)"
        fi

    # ensure mode, on a miss. `--cores 4` matches the check jobs' per-derivation setting.
    - name: Build tessera-deps
      if: >-
        inputs.mode == 'ensure' && steps.locate.outputs.key != ''
        && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        SYS: ${{ steps.locate.outputs.sys }}
        DEPS_OUT: ${{ steps.locate.outputs.out }}
      run: |
        nix build -L --no-link --fallback --cores 4 ".#legacyPackages.${SYS}.cargoArtifacts"
        nix path-info "${DEPS_OUT}"

    - name: Export the dependency cache
      id: export
      if: >-
        inputs.mode == 'ensure' && steps.locate.outputs.key != ''
        && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEPS_DIR: ${{ steps.locate.outputs.dir }}
        DEPS_OUT: ${{ steps.locate.outputs.out }}
      run: |
        t0=$(date +%s)
        if nix copy --to "file://${DEPS_DIR}?compression=zstd&parallel-compression=true" "${DEPS_OUT}"; then
          echo "exported $(du -sm "${DEPS_DIR}" | cut -f1) MiB in $(( $(date +%s) - t0 )) s"
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning title=dependency cache::export failed; not saving (#507)"
        fi

    - name: Save the dependency cache
      if: inputs.mode == 'ensure' && steps.export.outputs.ready == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.locate.outputs.dir }}
        key: ${{ steps.locate.outputs.key }}
