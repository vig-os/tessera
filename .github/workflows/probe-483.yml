# THROWAWAY measurement for #483 — delete with this branch. Never merged to dev.
#
# Question: if `minio` cannot be substituted from cache.nixos.org, how long does building it from
# source cost on each hosted runner? That decides whether `--fallback` is affordable or whether
# #483 should rely on `--keep-going` plus isolating the check.
#
# Method, faithful to the real failure (only minio's substitution failed; its build inputs were
# substitutable): substitute everything, DELETE just minio's outputs, then rebuild with substituters
# disabled so only minio and its go-modules FOD are built locally.
name: PROBE 483 minio build cost

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - 'ci/483-**'

permissions: {}

concurrency:
  group: probe-483-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: minio cost (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23

      - name: "Measure minio: substituted vs built from source"
        run: |
          # `set +e` deliberately: GitHub runs this with `bash -e`, which aborts before any `rc=$?`
          # capture, so a failing nix build would kill the step instead of being measured.
          set +e
          set -u
          NIXPKGS="github:NixOS/nixpkgs/567a49d1913ce81ac6e9582e3553dd90a955875f"
          # nixpkgs marks minio insecure (knownVulnerabilities); the flake's check strips that in an
          # overrideAttrs, so a direct `nix build nixpkgs#minio` refuses to evaluate. Allow it here —
          # `meta` is not part of the derivation, so this measures the same build the flake does.
          export NIXPKGS_ALLOW_INSECURE=1
          S="$GITHUB_STEP_SUMMARY"
          {
            echo "## minio build cost — ${{ matrix.arch }}"
            echo ""
            echo "- runner: \`${{ matrix.runner }}\`, nproc: \`$(nproc)\`"
            echo ""
            echo "| phase | seconds | rc |"
            echo "|---|---|---|"
          } >> "$S"

          echo "::group::substitute from cache (baseline)"
          t0=$(date +%s)
          OUT=$(nix build --impure --no-link --print-out-paths "$NIXPKGS#minio" 2>&1 | tee /dev/stderr | tail -1)
          rc=$?
          t1=$(date +%s)
          echo "::endgroup::"
          echo "PROBE483 substituted rc=$rc elapsed=$((t1-t0))s out=$OUT"
          echo "| substitute from cache (baseline) | $((t1-t0)) | $rc |" >> "$S"

          if [ "$rc" -ne 0 ] || [ ! -e "$OUT" ]; then
            echo "PROBE483 baseline failed — cannot measure a from-source build; stopping."
            echo "" >> "$S"; echo "Baseline substitute FAILED (rc=$rc); no from-source number." >> "$S"
            exit 0
          fi

          GOMOD=$(nix path-info -r "$OUT" 2>/dev/null | grep -E 'go-modules$' | head -1)
          echo "PROBE483 go-modules path: ${GOMOD:-<none>}"

          echo "::group::delete minio outputs only"
          nix store delete "$OUT" ${GOMOD:+"$GOMOD"} 2>&1 | tail -5
          delrc=$?
          echo "::endgroup::"
          echo "PROBE483 delete rc=$delrc"
          if [ "$delrc" -ne 0 ]; then
            echo "PROBE483 WARNING: delete failed, so the next phase is NOT a from-source build"
            echo "| (delete failed — next number is not from-source) | - | $delrc |" >> "$S"
          fi

          echo "::group::build from source (substituters disabled)"
          t2=$(date +%s)
          nix build --impure --no-link --option substitute false --option substituters '' "$NIXPKGS#minio" 2>&1 | tail -25
          rc2=${PIPESTATUS[0]}
          t3=$(date +%s)
          echo "::endgroup::"
          echo "PROBE483 from-source rc=$rc2 elapsed=$((t3-t2))s"
          echo "| **build from source** | **$((t3-t2))** | $rc2 |" >> "$S"

          {
            echo ""
            if [ "$rc2" -eq 0 ] && [ "$delrc" -eq 0 ]; then
              echo "From-source build **succeeded** in $((t3-t2))s (~$(( (t3-t2)/60 )) min)."
            elif [ "$rc2" -eq 0 ]; then
              echo "Build returned 0 but the delete failed, so this is a cache hit, not a real measurement."
            else
              echo "From-source build **FAILED** (rc=$rc2) after $((t3-t2))s — see the job log."
            fi
            echo ""
            echo "Budget: the nix leg times out at 90 min; observed real runs are ~57 min (x86_64) and"
            echo "~43 min (aarch64), leaving roughly 33 and 47 min of headroom."
          } >> "$S"
          # Always succeed: this probe reports a measurement, it does not gate anything.
          exit 0
