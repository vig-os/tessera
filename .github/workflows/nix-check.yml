# Nix flake check — a shim over `nix flake check`.
#
# REPO-OWNED, and deliberately NOT named ci.yml: adopting the vigOS devkit scaffold
# (#364) brings a managed `.github/workflows/ci.yml` that would overwrite this file.
# The cross-arch determinism gate below cannot live inside it (a `just` recipe cannot
# express a two-arch runner matrix), so it keeps its own workflow. The `gate` job is
# still named `nix flake check`, and branch protection matches the JOB name, not the
# file, so the required context is unchanged by the rename.
#
# The logic lives in the flake's `checks` (flake.nix), so the SAME command runs on a dev's
# machine and here — no "passes locally / fails in CI" drift, nothing to reproduce by hand.
# Run it yourself with the SAME flags CI uses:
#   nix flake check -L --keep-going --fallback --max-jobs 2 --cores 4
#
# Checks (see flake.nix): workspace-clippy · workspace-test · workspace-fmt ·
# guardrails-gates · dev-shell. cargo-deny + the full pre-commit gate set run via `prek`
# locally (they need network / the working tree).
#
# vig-os/tessera is PUBLIC → GitHub-hosted runner. Never self-hosted on a public repo (untrusted
# PRs = arbitrary code execution on your hardware). See guardrails docs/CONVENTIONS.md.
#
# CROSS-ARCH DETERMINISM GATE (ADR-0020/0024 release gate). The flake is `eachDefaultSystem`, so the
# checks already exist for aarch64-linux. Running `nix flake check` on BOTH `ubuntu-latest`
# (x86_64-linux) and `ubuntu-24.04-arm` (aarch64-linux — a GitHub-HOSTED ARM64 runner, free for public
# repos, so the no-self-hosted rule holds) makes the conformance gate
# (`tessera-io/tests/conformance.rs`) re-derive the golden id/content_hash/manifest_hash and the
# byte-identical `.tsra` on EACH arch. Green on both = the content-addressing is byte-reproducible
# x86==ARM — the writer-determinism property the spec stakes identity on, validated not assumed.
# `fail-fast: false` so a drift on one arch still reports the other.

name: CI

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - dev
      - 'release/**'
      - main
      # Stacked PRs (#463): a PR based on another topic branch matched none of
      # the bases above, so `nix flake check` -- the required status check on dev
      # -- never ran on it. '**' matches any base, including the three named
      # above (a PR matches the filter once, so this adds no duplicate runs).
      - '**'
  push:
    branches:
      - main
  workflow_dispatch:

# Added with the stacked-PR trigger widening (#463): this is the expensive lane
# (~40-60 min per leg and it varies, two arch legs per run), and the base filter above
# now matches any base, so without this a force-push to a stacked branch would
# leave two superseded ~40-90 min legs burning runner slots. Keyed per workflow AND
# per ref so distinct refs stay independent. `!= 'push'` mirrors ci.yml: the
# push-to-main leg must not be cancelled by a rapid follow-up merge. This file is
# this repo's own, not devkit-managed, so the group is durable.
concurrency:
  group: nix-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  check:
    name: nix flake check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A cold build of the vortex/zarrs/hdf5 stack is slow on a GitHub-hosted runner and varies a
    # lot between them: observed 40m (x86) and 51m (aarch64) on one run, then >60m on x86 for the
    # very next one, which the previous 60-minute cap cancelled mid-build. A cancelled leg is not
    # a code failure, but it blocks the merge and costs a full rebuild to find out — so the cap is
    # set above the observed spread rather than just above the median.
    #
    # Raised 90 -> 120 because the spread widened past 90 and the cap started cutting real work.
    # Measured leg durations, same workflow, all on GitHub-hosted runners:
    #
    #     commit     x86_64            aarch64
    #     7d2eaf8d   43m  success      41m  success
    #     33aa5134   46m  success      43m  success
    #     (pin PR)   57m  success      43m  success
    #     1442ba12   89m  TIMEOUT      54m  success
    #
    # The axis is NOT architecture. x86_64's own range is 43-89m, a 2.1x spread; aarch64's is
    # 41-54m, 1.3x. So x86_64 is not systematically slower — it is far more variable, and its bad
    # draws are what hit the cap. Sizing against "x86 is slower" would tune for a constant that is
    # not there; sizing against its own spread points at headroom, which is this change.
    #
    # 120 is the worst observed draw plus ~35%. Deliberately not higher: the cap also has to fail a
    # genuinely hung leg in reasonable time, and GitHub's own ceiling is 6 hours.
    #
    # This raises the ceiling, it does not make the legs faster. The variance is the real defect and
    # is tracked separately (#495) — the sampler added in #488 now records memory and disk on every
    # leg, so the next long draw can be diagnosed as I/O starvation, memory pressure or simply slow
    # silicon instead of guessed at. A concurrency cap (`--max-jobs`) must NOT land before this
    # change: at 89 of 90 minutes any slowdown converts an intermittent failure into a reliable one.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23

      # `--keep-going` is the fix for #483. Without it the FIRST failing derivation cancels every
      # other check, so a leg goes red with all 17 checks reporting `(cancelled)` and nothing naming
      # a real failure. That is exactly what happened on #481: an unrelated `minio` substitution
      # failed and took down the determinism gates, clippy, the wasm checks — none of which depend on
      # it. A red leg that names no failing check costs a reader log archaeology to distinguish from a
      # genuine break, and two reviewers paid that cost before it was understood.
      #
      # `--fallback` builds a derivation from source when it cannot be substituted, instead of
      # failing. Measured for the one that actually bit us, minio, on these exact runner images:
      # 102s (x86_64) and 73s (aarch64) — on aarch64 that is FASTER than pulling its 36 MiB from
      # cache.nixos.org, because the download is the slow part, not the Go build. Against the
      # 90-minute cap above, noise.
      #
      # The flag applies to EVERY derivation, so a pathological outage on something large (a
      # toolchain, LLVM) could build until that cap rather than failing in seconds. Deliberate: both
      # outcomes are a red leg, it is bounded by the budget already set above, and in exchange the
      # common case stops being a spurious failure. Accepted with that tradeoff stated rather than
      # discovered.
      #
      # `--max-jobs 2 --cores 4` is the memory fix, and every number below is measured (#495).
      #
      # WHAT DRIVES PEAK MEMORY: the number of CONCURRENT DERIVATIONS. Each is a separate
      # cargo/rustc process tree holding its own heap, so halving how many run at once halves the
      # dominant term. `--cores` caps threads INSIDE one derivation, which is the weaker factor.
      #
      # An earlier revision of this comment framed these as alternatives — "`--cores 2` keeps four
      # derivations in flight while `--max-jobs 2` serialises whole derivations and costs closer to
      # 2x" — and chose `--cores 2` alone on that basis. That framing was the error: the two are
      # independent knobs and the right answer combines them. `--cores 2` alone was not enough, and
      # #497 was OOM-KILLED (exit 137) at 15.5 GB with four derivations still in flight.
      #
      # `--max-jobs 2 --cores 4` keeps TOTAL cpu at ~8 (2 x 4, as the old 4 x 2) while halving the
      # concurrent process trees. Measured on scratch branches against both heavy branches:
      #
      #   leg           before (--cores 2)          after (--max-jobs 2 --cores 4)
      #   #497 x86      82m 14651 MB 1338 MB free   80m 11171 MB 4818 MB free   (-24% peak)
      #   #497 arm      66m 11503 MB 4444 MB free   54m 11431 MB 4516 MB free
      #   #461 x86      85m 13534 MB 2454 MB free   76m 12980 MB 3008 MB free
      #   #461 arm      69m 11536 MB 4410 MB free   55m 10690 MB 5256 MB free
      #
      # WALL-CLOCK IMPROVED ON ALL FOUR LEGS (-2, -12, -9, -14 min), which was NOT predicted — the
      # argument had been that it would stay neutral since total cpu is unchanged. Max load1 held at
      # 8.3-8.6 throughout, confirming cpu really was constant, so the gain is memory-pressure stalls
      # disappearing. The memory fix paid a wall-clock dividend rather than costing one.
      #
      # HONEST CAVEAT, and why #495 stays open. The accept bar was fixed BEFORE the run at
      # peak < 12288 MB and < 100 min. #461's x86 leg MISSED it: 12980 MB, over by 692 MB. It is
      # adopted anyway because it dominates the previous setting on every leg measured, but the
      # ceiling risk on the heaviest branch is REDUCED, NOT ELIMINATED — 3.0 GB of headroom. That leg
      # is the watch item on #495. Do not read four green legs as "solved".
      #
      # A contributing factor worth naming: peak climbed 10.2 -> 12.0 -> 15.6 GB across observed runs,
      # and the vortex fork pin (#480) is part of that — ~27 crates now compile from a git source with
      # no binary-cache substituter where they were previously downloaded. Removing the pin later
      # should give headroom back, at which point these flags can be revisited.
      #
      # Related, measured, and NOT fixed by these flags: there is no nix store cache (#507), so every
      # run recompiles the dependency graph from source — `tessera-deps` alone is a 19.4-minute serial
      # prefix, 23% of a leg. That is a wall-clock issue, not a memory one: the deps phase peaks at
      # 4.6 GB against a leg peak of 12.0 GB, so caching it would not lower the peak.
      #
      # `set +e` so a failure reaches the summary step below instead of ending the job here; the real
      # result is re-raised there, so the leg still fails when a check fails.
      - name: nix flake check
        id: check
        run: |
          set +e
          # Resource sampler, started INSIDE this step on purpose (#483). Three legs on #460/#461
          # died with the generic "runner has received a shutdown signal" and exit 143, with NO
          # in-job error — no ENOSPC, no OOM line. That is the shape of the runner AGENT being
          # killed rather than a build failing.
          #
          # The cause is now MEASURED, not inferred. This sampler caught it twice: a leg pegged at
          # 15.60 GB with ~340 MB available for 3m14s while load climbed 15.5 -> 29.0, then took the
          # signal; and #497 was killed outright with exit 137 (SIGKILL, the kernel's OOM killer)
          # after memory jumped 6956 -> 15531 MB inside one 4-minute window. Disk never fell below
          # 58.9 GB across those runs, so disk was never the constraint — tested on six legs across
          # four branches and never once supported.
          #
          # It must print to THIS step's stdout rather than to a file collected later: GitHub
          # streams step logs, so samples written before the agent dies are preserved, whereas a
          # file and an `always()` step both vanish with the runner. The last sample before a
          # shutdown is exactly the number worth having.
          ( while true; do
              printf '[res] %s | mem %s | %s | load %s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(free -m 2>/dev/null | awk '/^Mem:/{printf "used=%sM avail=%sM", $3, $7}')" \
                "$(df -m /nix /home/runner 2>/dev/null | awk 'NR>1{printf "%s avail=%sM ", $6, $4}')" \
                "$(cut -d' ' -f1-3 /proc/loadavg 2>/dev/null)"
              sleep 30
            done ) &
          sampler=$!
          # shellcheck disable=SC2064
          trap "kill $sampler 2>/dev/null" EXIT

          nix flake check -L --keep-going --fallback --max-jobs 2 --cores 4
          rc=$?
          kill "$sampler" 2>/dev/null
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "nix flake check exited $rc"

      # Per-check verdicts, so a red leg always names what failed (#483).
      #
      # Derived from the STORE, not by parsing nix's human-readable output: a check whose output path
      # is valid was built and therefore passed. `--keep-going` above is what makes that inference
      # sound, because every check is attempted, so a missing output means that check failed rather
      # than that it was skipped. No output format to drift against.
      - name: Summarise per-check results
        if: always()
        # Through `env:` rather than inline `${{ }}` in the run block: a workflow expression expanded
        # into shell is the template-injection shape the zizmor gate flags, and `matrix.arch` being
        # repo-controlled today does not make interpolating it a habit worth keeping.
        env:
          SYS: ${{ matrix.arch }}
          CHECK_RC: ${{ steps.check.outputs.rc }}
        run: |
          set +e
          S="$GITHUB_STEP_SUMMARY"

          # One evaluation for every check's output path, instead of `attrNames` followed by an
          # `outPath` eval per check: 17 nix evaluations became 1, and the name and the path can no
          # longer disagree because they come from the same attrset.
          paths_json=$(nix eval --json ".#checks.${SYS}" \
            --apply 'builtins.mapAttrs (_: c: c.outPath)' 2>/dev/null)

          if [ -z "$paths_json" ] || [ "$paths_json" = "{}" ]; then
            # Without this, a failed evaluation reported "0 passed, 0 failed or not built", which
            # reads like an empty-but-fine result rather than a broken one.
            {
              echo "## nix flake check — ${SYS}"
              echo ""
              echo ":warning: **Could not evaluate \`.#checks.${SYS}\`** — no per-check summary."
              echo "The flake may have failed to evaluate; the job log is authoritative."
            } >> "$S"
            echo "ERROR: could not evaluate .#checks.${SYS}; no summary produced"
            exit "${CHECK_RC:-1}"
          fi

          {
            echo "## nix flake check — ${SYS}"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
          } >> "$S"

          pass=0; fail=0; failed_names=""
          while IFS=$'\t' read -r name outp; do
            [ -n "$name" ] || continue
            # `--check-validity` is unambiguously LOCAL. Plain `nix path-info` may consult
            # substituters, which would report a path as present because a cache HAS it rather than
            # because this leg built it — turning a failed check into a green row. No extra
            # substituter is configured today, so this is closing a latent trap, not a live bug.
            if [ -n "$outp" ] && nix-store --check-validity "$outp" >/dev/null 2>&1; then
              echo "| \`$name\` | :white_check_mark: passed |" >> "$S"
              pass=$((pass+1))
            else
              echo "| \`$name\` | :x: failed or not built |" >> "$S"
              fail=$((fail+1)); failed_names="$failed_names $name"
            fi
          done <<< "$(jq -r 'to_entries[] | "\(.key)\t\(.value)"' <<< "$paths_json")"

          {
            echo ""
            echo "**$pass passed, $fail failed or not built** (\`nix flake check\` exited \`${CHECK_RC:-?}\`)."
            if [ "$fail" -gt 0 ]; then
              echo ""
              echo "Not built:$failed_names"
              echo ""
              echo "A check listed here either failed or never produced an output. With \`--keep-going\`"
              echo "every check is attempted, so the usual reading is a real failure — unless the leg hit"
              echo "its 90-minute cap, in which case the tail of the job log says so."
            fi
          } >> "$S"
          echo "summary: $pass passed, $fail failed or not built; check rc=${CHECK_RC:-?}"
          # Re-raise the real result: the check step swallowed it so this summary could run.
          exit "${CHECK_RC:-1}"

  # ── The single REQUIRED status check ──────────────────────────────────────────────────────
  # Branch protection matches context names EXACTLY. A matrix job is reported per-leg as
  # "nix flake check (x86_64-linux)" / "(aarch64-linux)", so a required context of
  # "nix flake check" can never be satisfied by `check` — the gate silently matches nothing and
  # every PR looks mergeable. This aggregate leg has a name that does NOT vary with the matrix,
  # so protection stays correct when an arch is added or renamed: point it at THIS job only.
  #
  # `if: always()` + an explicit result assertion is required — without it the job is *skipped*
  # when a leg fails, and a skipped required check is treated as neutral (i.e. passing) by
  # branch protection. `needs.check.result` is the aggregate over every matrix leg: it is
  # 'success' only when all of them succeeded.
  gate:
    name: nix flake check
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Assert every matrix leg passed
        run: |
          echo "aggregate result of 'check' matrix: ${{ needs.check.result }}"
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "::error::nix flake check did not pass on every arch"
            exit 1
          fi
