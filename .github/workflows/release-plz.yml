# Opens/updates the HELD release PR (workspace version bump + CHANGELOG) — ADR-0052. It never tags
# or publishes.
#
# FLOW: every push to `dev` (+ manual dispatch) runs `release-plz release-pr`, which keeps ONE release
# PR up to date with the next version and its CHANGELOG. Merging that PR is the deliberate 'cut'; the
# operator then pushes the unified `v<version>` tag on the merge commit, and the tag alone triggers
# cargo-dist's release.yml + release-nix.yml, which build and attach the artifacts (#337). First
# tagged release: v0.1.0-alpha.1 (2026-09-24).
#
# BASELINE = the last `v*` release TAG, not crates.io (#606). release-plz computes "what changed
# since the last release" against the cargo registry by default, and tessera's crates are deliberately
# not published there, so that mode saw every crate as never released and proposed nothing. We check
# the last release tag out as a worktree and pass its manifest as `--registry-manifest-path`.
# scripts/last-release-tag.sh picks the tag (SemVer incl. pre-releases, capped at the workspace
# version because v0.1.0 / v1.0.0-rc1 are older FORMAT-milestone tags, #608) and FAILS the job when there
# is none — never a silent fall-back to the registry. `git_only` mode is not usable: it opens the git
# repo at the manifest's directory, and our workspace lives in `tessera/`.
#
# release-plz runs as a pinned CLI, installed the way release-plz/action@v0.5 installs it, because
# the action has no input for `--registry-manifest-path`. cargo-semver-checks is not installed:
# `semver_check = false` in /release-plz.toml says why.
#
# NOTE: run from a branch other than `dev` (workflow_dispatch --ref), release-plz opens the release
# PR against THAT branch — it bases the PR on the checked-out branch. Such a PR is a test artefact.
# release-plz finds "its" open PR by branch prefix alone, whatever the PR's base: a test run with
# the same `pr_branch_prefix` as dev's would force-push the real release PR's branch. Close a test
# PR before its config reaches dev, or dev's next run adopts it.
#
# CONVENTIONS (#629): the release PR branch is `chore/release-plz-<timestamp>` and the release
# commit is a `chore` subject (`chore: release v<version>`) with no `Refs:` line; /release-plz.toml says why both pass
# the Commit Messages job (the bot-author exemptions in docs/COMMIT_MESSAGE_STANDARD.md).
#
# TOKEN: the release PR is opened with a GitHub App installation token (secrets.RP_APP_ID +
# RP_APP_PRIVATE_KEY, #430): the repo's GITHUB_TOKEN cannot create PRs (Actions PR-creation is off) and
# PRs it creates would not trigger CI anyway. If the App secrets are absent the mint step fails softly
# (continue-on-error) and the token falls back to RELEASE_PLZ_TOKEN / GITHUB_TOKEN as before.
name: release-plz

on:  # yamllint disable-line rule:truthy
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz
  cancel-in-progress: false

env:
  # release-plz/action@v0.5's default version, installed with the action's own method below.
  RELEASE_PLZ_VERSION: 0.3.169

jobs:
  release-pr:
    name: release-plz release-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history AND tags: the baseline is the last release tag (#606).
          fetch-depth: 0
          fetch-tags: true
          # release-plz authenticates with its own GIT_TOKEN; no credential is left in .git/config.
          persist-credentials: false
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - name: Check out the last release (release-plz's baseline)
        id: last-release
        run: |
          tag=$(scripts/last-release-tag.sh tessera/Cargo.toml)
          git worktree add --detach "$RUNNER_TEMP/last-release" "$tag"
          echo "release-plz baseline: $tag ($(git rev-parse --short "$tag^{commit}"))"
          echo "manifest=$RUNNER_TEMP/last-release/tessera/Cargo.toml" >> "$GITHUB_OUTPUT"
      - name: Mint GitHub App token (opens the release PR; its PRs trigger CI)
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        continue-on-error: true
        with:
          app-id: ${{ secrets.RP_APP_ID }}
          private-key: ${{ secrets.RP_APP_PRIVATE_KEY }}
          # Least privilege: release-plz pushes the release branch and opens/updates the PR.
          permission-contents: write
          permission-pull-requests: write
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624  # v1.23.0
        # The input, not a BINSTALL_VERSION env: the action sets that env from this input itself, so
        # an env set here is overridden and the LATEST cargo-binstall gets installed.
        with:
          version: 1.23.0
      - name: Install release-plz
        run: |
          cargo-binstall "release-plz@${RELEASE_PLZ_VERSION}" \
            --force --strategies=crate-meta-data,compile --no-confirm
          release-plz --version
      - name: Configure git user from the token
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: release-plz release-pr (held — no tag/publish)
        env:
          GIT_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          LAST_RELEASE_MANIFEST: ${{ steps.last-release.outputs.manifest }}
        run: |
          # The Cargo workspace is nested under `tessera/`, not the repo root.
          release-plz release-pr \
            --manifest-path tessera/Cargo.toml \
            --registry-manifest-path "$LAST_RELEASE_MANIFEST" \
            --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --forge github \
            -o json
