# A spec that tries to launder a domain schema onto a generic backend (ADR-0056 §7). Kept as a
# fixture because the REFUSAL is the documented behaviour — the walkthrough shows it being refused.
[collection]
name = "laundry"
timestamp = "2024-03-01T12:00:00Z"

[[product]]
name = "sneaky"
role = "raw"
schema = "listmode"        # ← a vendor schema, whose PS3.15 tiers nothing here validated
format = "csv"
input = "measurements.csv"
columns = ["run_id:u4", "detector:str", "energy_kev:f8?", "coincident:b1"]
