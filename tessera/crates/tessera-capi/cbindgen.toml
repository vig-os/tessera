# cbindgen config for include/tessera.h. Regenerate from tessera/crates/tessera-capi:
#   cbindgen --config cbindgen.toml --output include/tessera.h src/lib.rs
# The `capi-smoke` flake check regenerates it and fails when the committed header differs.
language = "C"
include_guard = "TESSERA_CAPI_H"
cpp_compat = true
style = "type"
usize_is_size_t = true
documentation = true
documentation_style = "c99"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
header = """/*
 * tessera.h: the C ABI of tessera-capi (spike #800). GENERATED by cbindgen from
 * tessera/crates/tessera-capi/src; do not edit, regenerate (see cbindgen.toml).
 */"""
# The Arrow C Data Interface structs, verbatim from the Arrow specification, behind the guard the
# specification defines, so that nanoarrow's or Arrow C++'s identical definitions and these coexist.
after_includes = """
#ifndef ARROW_C_DATA_INTERFACE
#define ARROW_C_DATA_INTERFACE

#define ARROW_FLAG_DICTIONARY_ORDERED 1
#define ARROW_FLAG_NULLABLE 2
#define ARROW_FLAG_MAP_KEYS_SORTED 4

struct ArrowSchema {
  const char* format;
  const char* name;
  const char* metadata;
  int64_t flags;
  int64_t n_children;
  struct ArrowSchema** children;
  struct ArrowSchema* dictionary;
  void (*release)(struct ArrowSchema*);
  void* private_data;
};

struct ArrowArray {
  int64_t length;
  int64_t null_count;
  int64_t offset;
  int64_t n_buffers;
  int64_t n_children;
  const void** buffers;
  struct ArrowArray** children;
  struct ArrowArray* dictionary;
  void (*release)(struct ArrowArray*);
  void* private_data;
};

#endif /* ARROW_C_DATA_INTERFACE */
"""

[parse]
parse_deps = false

[export]
prefix = ""
include = ["TsraStatus"]

[export.rename]
"FFI_ArrowArray" = "struct ArrowArray"
"FFI_ArrowSchema" = "struct ArrowSchema"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
