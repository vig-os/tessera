# cargo-deny — dependency licenses + RUSTSEC advisories for the Tessera workspace.
# Wired in ../.pre-commit-config.yaml (the cargo-deny gate cd's into tessera/ before running).
# Baseline from gerchowl/guardrails: permissive OSI allow-list, advisories deny-by-default with
# an explicit, auditable `ignore` list. Tessera itself is Apache-2.0 (already allowed).

[advisories]
version = 2
yanked = "warn"
ignore = [
    # paste v1.0.15 — UNMAINTAINED (not a vulnerability). A compile-time-only proc-macro pulled
    # transitively by zarrs/pcodec (zarrs_plugin/_data_type/_codec); "no safe upgrade available"
    # since zarrs depends on it. No runtime attack surface. Revisit when zarrs drops paste.
    "RUSTSEC-2024-0436",
    # encoding v0.2.33 — UNMAINTAINED (not a vulnerability). A legacy text-codec crate pulled
    # transitively by dicom-encoding (charset decoding of DICOM string VRs). No safe upgrade
    # while dicom 0.9 depends on it. Revisit when dicom migrates to `encoding_rs`.
    "RUSTSEC-2021-0153",
    # proc-macro-error2 v2.0.1 — UNMAINTAINED (not a vulnerability). A compile-time-only
    # proc-macro pulled transitively by age → i18n-embed-fl (the ADR-0047 crypto-shred
    # encryption dep). Both the original proc-macro-error and this fork are unmaintained;
    # no safe upgrade while age 0.11 depends on it. No runtime attack surface. Revisit
    # when age drops i18n-embed-fl.
    "RUSTSEC-2026-0173",
    # quick-xml v0.40.1 — two untrusted-XML DoS advisories, both fixed in quick-xml 0.41.0:
    #   RUSTSEC-2026-0194 — O(N²) duplicate-attribute-name check on a single start tag.
    #   RUSTSEC-2026-0195 — unbounded allocation in NamespaceResolver::push (NsReader) → OOM.
    # NO UPGRADE PATH: quick-xml is a transitive dep of object_store 0.14.0 (the latest release),
    # which caret-pins `quick-xml = "0.40.1"` (<0.41), so 0.41 is unreachable until object_store
    # cuts a release that relaxes the bound. object_store reaches us only via the optional `cloud`
    # feature of tessera-io and as a dev-dependency of tessera-cli — it parses S3 list-XML from the
    # operator's own configured store, not arbitrary attacker-supplied XML. Revisit on the next
    # object_store release (track upstream apache/arrow-rs object_store quick-xml bump).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # basic-toml v0.1.10 — UNMAINTAINED (not a vulnerability; advisory dated 2026-09-26, ignored
    # 2026-10-25). There's no safe upgrade. It's a compile-time-only dep: i18n-config 0.4.8 (the latest
    # release) uses it, and i18n-config is reached only through the i18n-embed-fl / i18n-embed-impl
    # proc-macros of age 0.11 (the ADR-0047 crypto-shred encryption dep, via tessera-ingest).
    # Those macros parse age's own bundled i18n.toml at build time. basic-toml isn't linked into any
    # tessera binary and never sees runtime or user input. age 0.12 doesn't help (same
    # i18n-config ^0.4.7). Upstream swapped it back to `toml` in kellpossible/cargo-i18n#176
    # (merged, unreleased). Remove this ignore when that ships: vig-os/tessera#665.
    "RUSTSEC-2026-0374",
    # zstd 0.13.3 / zstd-safe 7.2.4 / zstd-sys 2.0.16: four advisories (ignored 2026-10-26, #683).
    # NO UPGRADE PATH. zarrs 0.23.14 (latest) and zarrs main require zstd 0.13.3. The first parquet on
    # zstd 0.14 is 60.0, and it needs arrow 60, which the vortex 0.75 fork (arrow 58.3) and datafusion
    # 55 (arrow 59) can't take. tessera has no direct zstd calls. Its dependencies reach zstd only
    # through the bulk codecs of parquet, zarrs and arrow-ipc (`sql` feature), plus zarrs'
    # `decode_all`. clippy.toml bans the affected APIs in our code, and the
    # [[bans.features]] entry below bans `seekable`. Reachability evidence and exit criteria are in
    # vig-os/tessera#684. Re-verify it on every parquet or zarrs bump.
    # 0391: `stream::*::with_context` reuses a context unreset. No dependency calls it.
    "RUSTSEC-2026-0391",
    # 0398: `Seekable::decompress` set_len past capacity. Unreachable: `seekable` feature is off.
    "RUSTSEC-2026-0398",
    # 0403: `DCtx::decompress_stream` exposes uninit memory via `stream::write::Decoder`. Unreachable: no dependency uses it.
    "RUSTSEC-2026-0403",
    # 0410: wasm32 allocator shim. Unreachable: zstd-sys isn't in the tessera-wasm wasm32 graph.
    "RUSTSEC-2026-0410",
]

[licenses]
version = 2
confidence-threshold = 0.8
private = { ignore = true }   # don't license-gate first-party (publish=false) crates
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  # jpeg-encoder (via dicom-transfer-syntax-registry) — the Independent JPEG Group license,
  # classified FSF Free/Libre. Standard JPEG reference license; acceptable for an OSI/FAIR stack.
  "IJG",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

# RUSTSEC-2026-0398 (ignored above) lives in zstd's `seekable` code. It's unreachable only because no
# crate in the graph enables that feature. Ban it so nothing can turn it on (vig-os/tessera#684).
[[bans.features]]
crate = "zstd-safe"
deny = ["seekable"]

[[bans.features]]
crate = "zstd-sys"
deny = ["seekable"]

[sources]
unknown-registry = "deny"
# Tightened from `unknown-git = "allow"` alongside the vortex fork pin (#480). A blanket allow would
# have let ANY git dependency in unnoticed, which is exactly the review signal a fork pin should
# raise. Deny by default and allow precisely the one repository we pin.
unknown-git = "deny"
allow-git = ["https://github.com/gerchowl/vortex"]
